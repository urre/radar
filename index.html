<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">

	<title>Technology Radar</title>
	<meta name="description" content="A little technology radar map inspired from Thoughtworks publication Technology Radar">

	<link rel="icon" type="image/png" href="images/favicon.png" sizes="32x32">
	<link rel="apple-touch-icon" href="images/favicon.png">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300&display=swap">
	<link rel="stylesheet" href="css/radar.css">
</head>
<body>

	<div class="layoutswitch">
		<label for="layout">List</label>
		<input type="checkbox" id="layout" name="layout" class="switch" role="switch" aria-label="Show radar" checked>
		<label for="layout">Radar</label>
	</div>

	<div class="radar">
		<div class="xline"></div>
		<div class="yline"></div>
		<div id="blips"></div>

		<div class="techniques"><h3>Techniques</h3></div>
		<div class="tools"><h3>Tools</h3></div>
		<div class="frameworks"><h3>Frameworks</h3></div>
		<div class="platforms"><h3>Platforms</h3></div>

		<div class="adopt"></div>
		<div class="trial"></div>
		<div class="assess"></div>
		<div class="hold"></div>
	</div>

	<footer role="contentinfo" class="footer">
		<div class="container footer__grid">
			<div>
				<p>A simple technology radar map, made famous by <a href="https://www.thoughtworks.com/radar" rel="noopener noreferrer">Thoughtworks</a></p>
				<p><a href="https://github.com/urre/radar#make-your-own-radar" rel="noopener noreferrer">Make your own radar?</a></p>
			</div>
			<div>
				<p><a href="https://github.com/urre/radar" rel="noopener noreferrer">View on GitHub</a></p>
			</div>
		</div>
		<div class="footer__copy">
			<p><small>A project by <a href="https://urre.me" rel="noopener noreferrer">Urban Sandén</a></small></p>
		</div>
	</footer>

	<script src="js/radar.js" defer></script>

</body>
</html>
